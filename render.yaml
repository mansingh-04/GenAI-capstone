services:
  - type: web
    name: intelligent-news-credibility-api
    runtime: python
    region: oregon

    # Build Configuration
    buildCommand: |
      cd milestone2
      pip install --upgrade pip setuptools wheel
      pip install -r requirements.txt

    # Start Command
    startCommand: cd milestone2 && gunicorn -w 1 -k uvicorn.workers.UvicornWorker api.main:app --bind 0.0.0.0:$PORT

    # Python Version
    pythonVersion: 3.11

    # Environment Variables (Set these in Render dashboard or in .env file)
    envVars:
      - key: LLM_TYPE
        value: groq

      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      - key: API_HOST
        value: 0.0.0.0

      - key: API_PORT
        fromService:
          type: web
          name: intelligent-news-credibility-api
          property: port

      - key: API_DEBUG
        value: "False"

      - key: LOG_LEVEL
        value: INFO

    # Secret Environment Variables (Set these in Render dashboard)
    # These should be added as "Secret" environment variables in Render Dashboard:
    # - GROQ_API_KEY
    # - NEWSAPI_KEY
    # - API_SECRET_KEY
    # - HUGGINGFACE_API_KEY (optional)

    # Resource Configuration
    plan: standard
    numInstances: 1

    # Health Check (Optional but recommended)
    healthCheckPath: /

    # Maximum request size and timeout
    maxRequestSize: 32mb
    timeout: 120

    # Auto-deploy from Git
    autoDeploy: true

    # Custom domains (optional, add after deployment)
    # customDomains:
    #   - api.yourdomain.com
