services:
  - type: web
    name: intelligent-news-credibility-api
    runtime: python
    region: oregon

    # Build Configuration
    # Render now automatically installs root requirements.txt. 
    # We only need to download NLTK data.
    buildCommand: |
      python -m pip install --upgrade pip setuptools wheel && \
      python -c "import nltk; nltk.download('punkt'); nltk.download('stopwords'); nltk.download('punkt_tab')"

    # Start Command
    # Standard Gunicorn setup for FastAPI in a monorepo.
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker milestone2.api.main:app --bind 0.0.0.0:$PORT

    # Python Version
    pythonVersion: 3.11

    # Environment Variables
    envVars:
      - key: PYTHONPATH
        value: "."

      - key: LLM_TYPE
        value: groq

      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      - key: API_HOST
        value: 0.0.0.0

      - key: API_PORT
        fromService:
          type: web
          name: intelligent-news-credibility-api
          property: port

      - key: API_DEBUG
        value: "False"

      - key: LOG_LEVEL
        value: INFO

    # Resource Configuration
    plan: standard
    numInstances: 1

    # Health Check
    healthCheckPath: /

    # Auto-deploy
    autoDeploy: true
